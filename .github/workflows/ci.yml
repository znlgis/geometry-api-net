name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 恢复依赖
        run: dotnet restore

      - name: 构建项目
        run: dotnet build --configuration Release --no-restore

      - name: 运行测试
        run: dotnet test --configuration Release --no-build --verbosity normal

  real-data-harness:
    name: 真实数据 + PostGIS 交叉验证
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 30s --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 生成真实数据语料（Natural Earth）
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin unzip
          bash ./scripts/prep-data.sh realdata

      - name: 运行 harness + 单测
        env:
          GEOM_REAL_DATA_DIR: realdata
          GEOM_TEST_PG_HOST: localhost
          GEOM_TEST_PG_PORT: '5432'
          GEOM_TEST_PG_DB: postgres
          GEOM_TEST_PG_USER: postgres
          GEOM_TEST_PG_PASSWORD: postgres
          GEOM_HARNESS_SAMPLE: '150'
        run: bash ./run-tests.sh
